[project]
name = "ai-service"
version = "0.2.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    # "google-genai>=1.0.0",
    # "aiohttp>=3.9.0,<3.10.0",
    "openai>=1.0.0",
    "sentry-sdk[fastapi]>=2.0.0",
    "langfuse>=4.0.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 의존 플러그인 부재를 수집 시점에 즉시 실패시킨다 — 로컬 pytest에 pytest-asyncio가 없어
# async 테스트가 조용히 스킵/오류나던 문제를 차단한다(재감사 #11). 도커·CI는 dev 의존성으로
# 항상 설치되므로 정상 경로엔 영향이 없다.
required_plugins = ["pytest-asyncio", "pytest-cov"]

# 커버리지는 분기(branch)까지 측정한다 — 오류 경로의 미실행 분기를 수치로 드러내기 위함(재감사 #9).
# 측정 대상은 제품 코드(src)뿐. 최저선 게이트(--cov-fail-under)는 CI에서만 걸어, 단일 파일
# 부분 실행이 낮은 커버리지로 실패하지 않게 한다.
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
