[project]
name = "ai-service"
version = "0.2.6"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic-settings>=2.0.0",
    # Google SDK 어댑터용(KNK-951).
    "google-genai>=2.0.0",
    "openai>=1.0.0",
    # Anthropic 어댑터용(KNK-675). 하한은 **실제로 열어보고 확인한 버전**이다 — 예외 계층
    # (APITimeoutError가 APIConnectionError의 하위)과 클라이언트 인자를 이 버전에서 직접 확인했다.
    # 더 낮은 버전이 되는지는 확인하지 않았다. 낮출 이유가 생기면 그때 같은 방식으로 확인하고 정한다.
    # 0.x라 major 상한도 함께 둔다(langfuse와 같은 관례).
    "anthropic>=0.120.0,<1",
    "sentry-sdk[fastapi]>=2.0.0",
    "langfuse>=4.0.0,<5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# 의존 플러그인 부재를 수집 시점에 즉시 실패시킨다 — 로컬 pytest에 pytest-asyncio가 없어
# async 테스트가 조용히 스킵/오류나던 문제를 차단한다(재감사 #11). 도커·CI는 dev 의존성으로
# 항상 설치되므로 정상 경로엔 영향이 없다.
required_plugins = ["pytest-asyncio", "pytest-cov"]

# 커버리지는 분기(branch)까지 측정한다 — 오류 경로의 미실행 분기를 수치로 드러내기 위함(재감사 #9).
# 측정 대상은 제품 코드(src)뿐. 최저선 게이트(--cov-fail-under)는 CI에서만 걸어, 단일 파일
# 부분 실행이 낮은 커버리지로 실패하지 않게 한다.
[tool.coverage.run]
branch = true
source = ["src"]

[tool.coverage.report]
show_missing = true
