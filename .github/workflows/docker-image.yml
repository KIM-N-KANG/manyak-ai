name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR(dev) 푸시
  id-token: write # AWS OIDC(main) 인증

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-ai
  ECR_REPOSITORY: manyak-ai
  AWS_REGION: ap-northeast-2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests
        env:
          DEEPSEEK_API_KEY: dummy-key-for-ci
        run: pytest

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시 → 개발용 GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 푸시 → 배포용 ECR (OIDC, 장기 키 미보관)
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # 대상 레지스트리/태그 결정: main → ECR(latest, short-sha), 그 외 → GHCR(dev, short-sha)
      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${ECR_REPOSITORY}:latest"
              echo "${REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE}:dev"
              echo "${GHCR_IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # main 푸시(ECR 갱신) 후 → SSM Run Command 로 EC2에 AI 배포 + 내부 헬스 스모크
  deploy:
    name: Deploy AI to EC2 (prod)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포를 직렬화(큐잉)한다. cancel-in-progress=false: 진행 중 배포를 취소하지 않는다.
    # (true 면 SSM send-command 로 EC2에 이미 dispatch된 원격 배포는 못 막고 GitHub 잡만 취소돼 레이스가 남음)
    # 큐잉이라 푸시 순서대로 배포되어 최신 SHA 가 마지막에 반영된다. server 배포와는 레포가 달라 별도 그룹이다.
    concurrency:
      group: manyak-ai-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 빌드 시간차로 순서가 뒤집혀도 older SHA 가 배포되지 않도록, 이 run 의 SHA 가 main HEAD 인지 확인.
      # 아니면(더 새 푸시가 있으면) 이후 배포·스모크 스텝을 건너뛴다(concurrency 큐잉의 순서 미보장 보완).
      - name: Gate — 최신 main SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 main($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve target EC2 instance
        id: ec2
        if: steps.gate.outputs.skip != 'true'
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=manyak" "Name=tag:Name,Values=manyak-prod-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::running 상태의 manyak-prod-app EC2를 찾지 못했습니다 (terraform apply 선행 필요)"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "대상 인스턴스: $INSTANCE_ID"

      - name: Deploy via SSM + EC2 내부 헬스 스모크
        if: steps.gate.outputs.skip != 'true'
        run: |
          # 이 워크플로가 빌드·푸시한 정확한 이미지(short-sha)를 배포 — :latest 의 동시 push 모호성·추적성 문제 회피
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}"
          echo "배포 이미지: $IMAGE"
          # AI 는 ALB 외부 노출이 없어 공개 URL 스모크가 불가하다. 따라서 SSM 한 번으로
          # ① deploy.sh 로 ai 컨테이너 교체 후 ② EC2 내부에서 localhost:8000 헬스를 직접 확인한다.
          # '&&' 로 묶어 deploy.sh 실패 시 헬스 단계로 넘어가지 않게 하고, 헬스 실패 시 SSM 도 실패로 전파한다.
          # 헬스(②)의 $(seq)/$i 는 EC2 에서 실행돼야 하므로 작은따옴표로 리터럴 보존한다.
          # shellcheck disable=SC2016  # 의도적: 러너가 아닌 EC2 에서 확장되도록 단일따옴표 유지
          HEALTH='for i in $(seq 1 24); do curl -fsS http://localhost:8000/api/v1/health >/dev/null && exit 0; sleep 5; done; exit 1'
          DEPLOY_CMD="AI_IMAGE_OVERRIDE=$IMAGE bash /opt/manyak/deploy.sh && $HEALTH"
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "AWS-RunShellScript" \
            --comment "manyak-ai deploy ${GITHUB_SHA::7}" \
            --parameters commands="$DEPLOY_CMD" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          # terminal 상태까지 폴링 (기본 `wait command-executed` 의 100s 한계로 InProgress 를 실패로 오판하지 않도록)
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "✅ SSM Success (배포 + AI 내부 헬스 OK)"; break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::SSM $STATUS — 배포 또는 AI 헬스 실패"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query "StandardErrorContent" --output text || true
                exit 1 ;;
              *) echo "SSM $STATUS — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATUS" = "Success" ]
