name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR(dev) 푸시
  id-token: write # AWS OIDC(main) 인증

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-ai
  ECR_REPOSITORY: manyak-ai
  AWS_REGION: ap-northeast-2

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # branch coverage를 측정하고 최저선(90%) 아래면 실패시킨다(재감사 #9). 최저선은 현재
      # 커버리지(95%)보다 낮게 잡은 baseline이다 — 정상 변경을 막지 않으면서 회귀를 걸러내고,
      # 팀 합의로 점차 올린다. term-missing이 미실행 라인을 PR 로그에 남긴다.
      - name: Run tests
        env:
          DEEPSEEK_API_KEY: dummy-key-for-ci
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  # 빌드한 이미지를 실제로 기동해 /api/v1/health 200을 PR 단계에서 확인한다(KNK-574 감사 3장).
  # CI가 이미지를 빌드만 하고 띄우지 않아, COPY prompt 누락 등 패키징 회귀가 prod 배포 게이트에서야
  # 드러나던 공백을 메운다. 프롬프트 로딩이 임포트 시점이라 컨테이너 기동만으로 회귀가 걸린다.
  smoke:
    name: Image smoke (health)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 러너 아키텍처(amd64) 단일 이미지를 로컬 데몬에 적재한다(멀티아치 build-push는 --load 불가).
      - name: Build image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: manyak-ai:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check health
        run: |
          docker run -d --name ai-smoke -e DEEPSEEK_API_KEY=dummy-key-for-ci -p 8000:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "✅ /api/v1/health 200 ok"; cat /tmp/health.json
              docker rm -f ai-smoke; exit 0
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::health 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke
          docker rm -f ai-smoke; exit 1

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: [test, smoke]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시 → 개발용 GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 푸시 → 배포용 ECR (OIDC, 장기 키 미보관)
      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      # 대상 레지스트리/태그 결정: main → ECR(latest, short-sha), 그 외 → GHCR(dev, short-sha)
      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${ECR_REPOSITORY}:latest"
              echo "${REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE}:dev"
              echo "${GHCR_IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # main 푸시(ECR 갱신) 후 → 전용 SSM 문서(manyak-prod-ai-deploy)로 EC2에 AI 배포
  # (문서가 내부에서 deploy.sh + `up -d --wait ai` 로 health 게이트까지 수행)
  deploy:
    name: Deploy AI to EC2 (prod)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포를 직렬화(큐잉)한다. cancel-in-progress=false: 진행 중 배포를 취소하지 않는다.
    # (true 면 SSM send-command 로 EC2에 이미 dispatch된 원격 배포는 못 막고 GitHub 잡만 취소돼 레이스가 남음)
    # 큐잉이라 푸시 순서대로 배포되어 최신 SHA 가 마지막에 반영된다. server 배포와는 레포가 달라 별도 그룹이다.
    concurrency:
      group: manyak-ai-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 빌드 시간차로 순서가 뒤집혀도 older SHA 가 배포되지 않도록, 이 run 의 SHA 가 main HEAD 인지 확인.
      # 아니면(더 새 푸시가 있으면) 이후 배포·스모크 스텝을 건너뛴다(concurrency 큐잉의 순서 미보장 보완).
      - name: Gate — 최신 main SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 main($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve target EC2 instance
        id: ec2
        if: steps.gate.outputs.skip != 'true'
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=manyak" "Name=tag:Name,Values=manyak-prod-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::running 상태의 manyak-prod-app EC2를 찾지 못했습니다 (terraform apply 선행 필요)"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "대상 인스턴스: $INSTANCE_ID"

      - name: Deploy via SSM (전용 문서 manyak-prod-ai-deploy)
        if: steps.gate.outputs.skip != 'true'
        run: |
          # 이 워크플로가 빌드·푸시한 정확한 이미지(short-sha)를 배포 — :latest 의 동시 push 모호성·추적성 문제 회피
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}"
          echo "배포 이미지: $IMAGE"
          # 전용 SSM 문서(manyak-prod-ai-deploy)가 내부에서 AI_IMAGE_OVERRIDE 로 deploy.sh 를 실행하고
          # `docker compose up -d --wait ai` 로 ai healthcheck(/api/v1/health status==ok) 통과까지 대기한다.
          # 따라서 send-command 성공 = 배포 + ai healthy. (전용 역할이라 임의 셸 불가 → 별도 헬스 스모크 스텝 없음)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "manyak-prod-ai-deploy" \
            --comment "manyak-ai deploy ${GITHUB_SHA::7}" \
            --parameters ImageUri="$IMAGE" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          # terminal 상태까지 폴링 (기본 `wait command-executed` 의 100s 한계로 InProgress 를 실패로 오판하지 않도록)
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "✅ SSM Success (배포 + ai healthcheck 통과)"; break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::SSM $STATUS — 배포 또는 ai health 실패"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query "StandardErrorContent" --output text || true
                exit 1 ;;
              *) echo "SSM $STATUS — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATUS" = "Success" ]
