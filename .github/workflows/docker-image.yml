name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR 푸시(dev, main)와 :dev, :prod 태그 이동

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-ai

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # branch coverage를 측정하고 최저선(90%) 아래면 실패시킨다(재감사 #9). 최저선은 현재
      # 커버리지(95%)보다 낮게 잡은 baseline이다 — 정상 변경을 막지 않으면서 회귀를 걸러내고,
      # 팀 합의로 점차 올린다. term-missing이 미실행 라인을 PR 로그에 남긴다.
      - name: Run tests
        env:
          DEEPSEEK_API_KEY: dummy-key-for-ci
          OPENAI_API_KEY: dummy-key-for-ci
          GEMINI_API_KEY: dummy-key-for-ci
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  # 빌드한 이미지를 실제로 기동해 /api/v1/health 200을 PR 단계에서 확인한다(KNK-574 감사 3장).
  # CI가 이미지를 빌드만 하고 띄우지 않아, COPY prompt 누락 등 패키징 회귀가 prod 배포 게이트에서야
  # 드러나던 공백을 메운다. 프롬프트 로딩이 임포트 시점이라 컨테이너 기동만으로 회귀가 걸린다.
  smoke:
    name: Image smoke (health)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 러너 아키텍처(amd64) 단일 이미지를 로컬 데몬에 적재한다(멀티아치 build-push는 --load 불가).
      - name: Build image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: manyak-ai:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check health
        run: |
          docker run -d --name ai-smoke \
            -e DEEPSEEK_API_KEY=dummy-key-for-ci \
            -e OPENAI_API_KEY=dummy-key-for-ci \
            -e GEMINI_API_KEY=dummy-key-for-ci \
            -e ANTHROPIC_API_KEY=dummy-key-for-ci \
            -p 8000:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "✅ /api/v1/health 200 ok"; cat /tmp/health.json
              docker rm -f ai-smoke; exit 0
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::health 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke
          docker rm -f ai-smoke; exit 1

      # Langfuse 활성 경로 스모크(KNK-652 리뷰 P2). 유닛 테스트의 활성 경로는 가짜 SDK를 쓰고
      # (전역 openai 패치 부작용 격리), 위 기본 스모크는 키 없이 no-op 경로만 지난다 — 실제 설치된
      # langfuse SDK(lock 파일 없는 4.x 범위)로 초기화가 깨지는 회귀를 여기서 잡는다. 더미 키라
      # 과금·실데이터 전송 없음(백그라운드 인증 실패만 무해하게 남음). health에 더해 "Langfuse 활성"
      # 로그까지 확인해 가드(JP·prod) 통과 + 실 SDK 초기화 성공을 함께 고정한다.
      - name: Run container with Langfuse enabled (dummy keys) and check health
        run: |
          docker run -d --name ai-smoke-lf \
            -e DEEPSEEK_API_KEY=dummy-key-for-ci \
            -e OPENAI_API_KEY=dummy-key-for-ci \
            -e GEMINI_API_KEY=dummy-key-for-ci \
            -e ANTHROPIC_API_KEY=dummy-key-for-ci \
            -e LANGFUSE_PUBLIC_KEY=pk-lf-dummy-ci \
            -e LANGFUSE_SECRET_KEY=sk-lf-dummy-ci \
            -e LANGFUSE_HOST=https://jp.cloud.langfuse.com \
            -e SENTRY_ENVIRONMENT=prod \
            -p 8001:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health-lf.json -w '%{http_code}' http://localhost:8001/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health-lf.json; then
              if docker logs ai-smoke-lf 2>&1 | grep -q "Langfuse 활성"; then
                echo "✅ health 200 ok + Langfuse 활성(실 SDK 초기화·가드 통과)"
                docker rm -f ai-smoke-lf; exit 0
              fi
              echo "::error::health는 통과했으나 'Langfuse 활성' 로그 없음 — 가드/초기화 회귀:"; docker logs ai-smoke-lf
              docker rm -f ai-smoke-lf; exit 1
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::Langfuse 활성 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke-lf
          docker rm -f ai-smoke-lf; exit 1

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: [test, smoke]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev, main 푸시와 main 수동 실행은 GHCR :<sha7>로 올린다. 운영(OCI)은 GHCR :prod를 따라간다(KNK-2126).
      # 빌드 잡에서 :dev, :prod를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다.
      # 가변 태그는 각 배포 잡의 최신 SHA 게이트 뒤(직렬화 구간)에서 옮긴다(KNK-829, KNK-963).
      - name: Log in to GHCR
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: image-tags
        run: echo "tags=${GHCR_IMAGE}:${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # dev 푸시(GHCR 갱신) 후 → :dev 승격(dev 환경이 받아 감, KNK-2125)
  deploy-dev:
    name: Deploy to app host (dev)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # :dev 승격을 직렬화한다(늦게 끝난 옛 실행이 태그를 되돌리지 않게). 잡 이름은 체크 이름을 바꾸지 않으려고 그대로 둔다.
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # GHCR 의 dev 는 가변 태그다. 더 새 푸시가 있으면 그쪽 잡이 배포하게 두고 여기서는 건너뛴다.
      - name: Gate — 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다(리뷰 지적). manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

      # dev 환경이 :dev 다이제스트를 주기적으로 확인해 스스로 pull하고 ai 컨테이너를 다시 만든다(KNK-2125).
      # 여기서는 :dev만 옮기고 배포 명령을 보내지 않는다.
      # (예전 EC2 앱 호스트 SSM 배포 단계는 전환과 함께 뺐다.)

      # 공개 주소로 끝까지 닿는지 본다. 새 이미지 교체는 dev 환경이 따로 하므로 여기서 버전까지 맞추지는 않는다.
      - name: Smoke test (server /actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://dev-api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ dev health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::dev health 200/UP 확인 실패. dev 환경의 ai 컨테이너 상태와 로그 확인"; exit 1


  # main 푸시 후 → GHCR :prod 를 main HEAD 로 옮기고, OCI 운영 호스트가 바꿔 띄울 때까지 기다린 뒤 공개 스모크 (KNK-2126).
  # CI 는 호스트에 명령을 보내지 않는다. 호스트의 updater(systemd 타이머, 앞 실행이 끝나고 60초 뒤 다시 돈다)가
  # :prod 다이제스트가 지금 이미지와 다르면 deploy.sh 로 무중단 배포한다.
  # ai 는 내부 프록시(ai.internal, server 가 부름)를 넘기고 옛 컨테이너의 진행 중 스트림을 드레인한다.
  # 새 컨테이너가 헬스(모델과 공급자 키 기동 검사 포함)를 못 넘으면 옛 ai 가 계속 서비스하고, 그 다이제스트는 실패로 기록돼 다시 시도하지 않는다.
  # 정본: manyak-terraform oci/prod/scripts/update.sh, oci/prod/deploy.sh
  deploy-prod:
    name: Deploy to app host (prod)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # :prod 이동을 직렬화(큐잉)한다. 늦게 끝난 옛 실행이 :prod 를 되돌리지 않게 한다.
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 배포 대상은 "이 실행의 커밋"이 아니라 "현재 main HEAD"다.
      # 예전처럼 "내가 HEAD 가 아니면 skip" 하면 최신 커밋이 아무 데서도 배포되지 않을 수 있다 —
      # GitHub concurrency 는 대기 슬롯이 1개라, 늦게 끝난 옛 빌드의 잡이 큐에서 기다리던 최신
      # 실행을 밀어내 취소시키고, 정작 자기는 게이트에서 skip 하기 때문이다.
      # 어느 실행이 돌든 항상 HEAD 를 배포하면 그 구멍이 사라진다(중복 배포는 같은 이미지라 무해).
      - name: Gate — 배포 대상(main HEAD) 확인
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          {
            echo "deploy_sha=$DEPLOY_SHA"
            echo "deploy_short_sha=${DEPLOY_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "배포 대상 main HEAD: $DEPLOY_SHA (이 실행의 커밋: $GITHUB_SHA)"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # HEAD 의 이미지가 아직 GHCR 에 없으면 = HEAD 빌드가 아직 안 끝났다는 뜻이라 여기서 멈춘다.
      # 실패가 아니다 — 그 커밋 자신의 실행이 배포한다.
      - name: Check image for main HEAD
        id: image
        run: |
          IMAGE="${GHCR_IMAGE}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if OUT=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "배포 이미지 확인: $IMAGE"
            exit 0
          fi
          echo "$OUT"
          # 조회 실패를 뭉뚱그려 "아직 빌드 안 됨"으로 넘기지 않는다(fail-closed).
          if [ "${{ steps.gate.outputs.deploy_sha }}" = "$GITHUB_SHA" ]; then
            echo "::error::이 실행이 방금 push 한 HEAD 이미지($IMAGE)를 조회하지 못했습니다 — 빌드 또는 권한 문제"
            exit 1
          fi
          if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD(${{ steps.gate.outputs.deploy_short_sha }}) 이미지가 아직 GHCR 에 없습니다(매니페스트 부재로 판별) — 그 커밋의 실행이 배포합니다"
            exit 0
          fi
          echo "::error::이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다(인증·네트워크 등) — 위 출력 확인"
          exit 1

      # 지금 :prod 다이제스트를 남겨 두고(스모크가 실패하면 되돌릴 곳) :prod 를 main HEAD 로 옮긴다. 이것이 배포다.
      # manifest 를 복사하므로 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Move GHCR :prod to main HEAD
        id: promote
        if: steps.image.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if PREV=$(docker buildx imagetools inspect "${GHCR_IMAGE}:prod" --format '{{.Manifest.Digest}}' 2>&1); then
            [[ "$PREV" =~ ^sha256:[a-f0-9]{64}$ ]] || { echo "::error::지금 :prod 다이제스트를 읽지 못했습니다: $PREV"; exit 1; }
          elif printf '%s' "$PREV" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "::notice:::prod 가 아직 없습니다(첫 배포). 스모크가 실패해도 되돌릴 곳이 없습니다"
            PREV=""
          else
            echo "$PREV"; echo "::error::지금 :prod 조회가 매니페스트 부재가 아닌 이유로 실패했습니다. :prod 는 그대로입니다"; exit 1
          fi
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "$IMAGE"
          echo "moved=true" >> "$GITHUB_OUTPUT"
          echo "✅ GHCR :prod -> ${{ steps.gate.outputs.deploy_short_sha }} (직전 ${PREV:-없음})"

      # ai 는 공개 주소가 없어 CI 가 교체를 직접 볼 수 없다. updater 주기(약 1분)와 기동(약 15초)을 넉넉히 기다린 뒤
      # 공개 api 헬스로 운영이 살아 있는지 본다. 교체 성공과 실패는 updater 알림과 운영 로그로 확인한다.
      - name: Wait for OCI updater
        if: steps.promote.outputs.moved == 'true'
        run: sleep 180

      - name: Smoke test (server /actuator/health)
        if: steps.promote.outputs.moved == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS --max-time 10 https://api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::health 200/UP 확인 실패 — 운영 로그 확인"; exit 1

      # 스모크가 실패하면 :prod 를 직전 다이제스트로 되돌린다. updater 가 다음 주기에 직전 이미지로 다시 배포한다
      # (새 컨테이너가 처음부터 못 떴다면 지금 이미지와 같아 아무것도 하지 않는다). 완료는 기다리지 않는다 — 잡은 이미 실패다.
      - name: Roll back GHCR :prod on failure
        if: failure() && steps.promote.outputs.moved == 'true'
        env:
          PREV: ${{ steps.promote.outputs.prev }}
        run: |
          if [ -z "$PREV" ]; then
            echo "::warning::직전 :prod 가 없어 되돌리지 않았습니다. 운영 상태를 직접 확인하세요"; exit 0
          fi
          docker buildx imagetools create --tag "${GHCR_IMAGE}:prod" "${GHCR_IMAGE}@${PREV}"
          echo "::warning::실패로 GHCR :prod 를 직전 다이제스트($PREV)로 되돌렸습니다. updater 가 1~2분 안에 다시 배포합니다. 헬스를 직접 확인하세요"
