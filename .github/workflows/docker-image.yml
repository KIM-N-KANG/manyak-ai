name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR(dev) 푸시
  id-token: write # AWS OIDC(dev·main) 인증

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-ai
  ECR_REPOSITORY: manyak-ai
  AWS_REGION: ap-northeast-2
  # 운영 단일 EC2 앱 호스트(KNK-2106, manyak-terraform envs/prod/app-host.tf). 배포는 서비스별 SSM 문서로 한다.
  PROD_DEPLOY_DOCUMENT: manyak-prod-host-deploy-ai
  PROD_HOST_TAG: manyak-prod-host

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # branch coverage를 측정하고 최저선(90%) 아래면 실패시킨다(재감사 #9). 최저선은 현재
      # 커버리지(95%)보다 낮게 잡은 baseline이다 — 정상 변경을 막지 않으면서 회귀를 걸러내고,
      # 팀 합의로 점차 올린다. term-missing이 미실행 라인을 PR 로그에 남긴다.
      - name: Run tests
        env:
          DEEPSEEK_API_KEY: dummy-key-for-ci
          OPENAI_API_KEY: dummy-key-for-ci
          GEMINI_API_KEY: dummy-key-for-ci
          ANTHROPIC_API_KEY: dummy-key-for-ci
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  # 빌드한 이미지를 실제로 기동해 /api/v1/health 200을 PR 단계에서 확인한다(KNK-574 감사 3장).
  # CI가 이미지를 빌드만 하고 띄우지 않아, COPY prompt 누락 등 패키징 회귀가 prod 배포 게이트에서야
  # 드러나던 공백을 메운다. 프롬프트 로딩이 임포트 시점이라 컨테이너 기동만으로 회귀가 걸린다.
  smoke:
    name: Image smoke (health)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 러너 아키텍처(amd64) 단일 이미지를 로컬 데몬에 적재한다(멀티아치 build-push는 --load 불가).
      - name: Build image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: manyak-ai:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check health
        run: |
          docker run -d --name ai-smoke \
            -e DEEPSEEK_API_KEY=dummy-key-for-ci \
            -e OPENAI_API_KEY=dummy-key-for-ci \
            -e GEMINI_API_KEY=dummy-key-for-ci \
            -e ANTHROPIC_API_KEY=dummy-key-for-ci \
            -p 8000:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "✅ /api/v1/health 200 ok"; cat /tmp/health.json
              docker rm -f ai-smoke; exit 0
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::health 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke
          docker rm -f ai-smoke; exit 1

      # Langfuse 활성 경로 스모크(KNK-652 리뷰 P2). 유닛 테스트의 활성 경로는 가짜 SDK를 쓰고
      # (전역 openai 패치 부작용 격리), 위 기본 스모크는 키 없이 no-op 경로만 지난다 — 실제 설치된
      # langfuse SDK(lock 파일 없는 4.x 범위)로 초기화가 깨지는 회귀를 여기서 잡는다. 더미 키라
      # 과금·실데이터 전송 없음(백그라운드 인증 실패만 무해하게 남음). health에 더해 "Langfuse 활성"
      # 로그까지 확인해 가드(JP·prod) 통과 + 실 SDK 초기화 성공을 함께 고정한다.
      - name: Run container with Langfuse enabled (dummy keys) and check health
        run: |
          docker run -d --name ai-smoke-lf \
            -e DEEPSEEK_API_KEY=dummy-key-for-ci \
            -e OPENAI_API_KEY=dummy-key-for-ci \
            -e GEMINI_API_KEY=dummy-key-for-ci \
            -e ANTHROPIC_API_KEY=dummy-key-for-ci \
            -e LANGFUSE_PUBLIC_KEY=pk-lf-dummy-ci \
            -e LANGFUSE_SECRET_KEY=sk-lf-dummy-ci \
            -e LANGFUSE_HOST=https://jp.cloud.langfuse.com \
            -e SENTRY_ENVIRONMENT=prod \
            -p 8001:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health-lf.json -w '%{http_code}' http://localhost:8001/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health-lf.json; then
              if docker logs ai-smoke-lf 2>&1 | grep -q "Langfuse 활성"; then
                echo "✅ health 200 ok + Langfuse 활성(실 SDK 초기화·가드 통과)"
                docker rm -f ai-smoke-lf; exit 0
              fi
              echo "::error::health는 통과했으나 'Langfuse 활성' 로그 없음 — 가드/초기화 회귀:"; docker logs ai-smoke-lf
              docker rm -f ai-smoke-lf; exit 1
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::Langfuse 활성 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke-lf
          docker rm -f ai-smoke-lf; exit 1

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: [test, smoke]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시 → 개발용 GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 푸시 → 배포용 ECR (OIDC, 장기 키 미보관)
      # main 에서의 수동 실행(workflow_dispatch)도 포함한다. 인증을 건너뛰면 Resolve image tags 의
      # main 분기가 빈 registry 로 잘못된 태그를 만들어 빌드가 실패한다(KNK-963). 수동 실행은
      # 테스트·빌드와 ECR :short-sha 재push 까지만 하고, 배포(deploy-prod)는 push 이벤트 전용이다.
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/amazon-ecr-login@v2

      # 대상 레지스트리/태그 결정: main → ECR(short-sha), 그 외 → GHCR(short-sha)
      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # main 브랜치도 여기서 :latest 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :latest 를 옛 SHA 로 되돌릴 수 있다.
            # :latest 승격은 deploy-prod 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-963).
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # dev 브랜치는 여기서 :dev 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :dev 를 옛 SHA 로 되돌릴 수 있다.
            # :dev 승격은 deploy-dev 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-829).
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # dev 푸시(GHCR 갱신) 후 → :dev 승격(홈서버 updater가 받아 감, KNK-2125)
  deploy-dev:
    name: Deploy to app host (dev)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # :dev 승격을 직렬화한다(늦게 끝난 옛 실행이 태그를 되돌리지 않게). 잡 이름은 체크 이름을 바꾸지 않으려고 그대로 둔다.
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # GHCR 의 dev 는 가변 태그다. 더 새 푸시가 있으면 그쪽 잡이 배포하게 두고 여기서는 건너뛴다.
      - name: Gate — 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다(리뷰 지적). manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

      # dev 서버는 홈서버에서 돈다(KNK-2125, manyak-terraform homeserver/dev). 홈서버 updater가 1분마다 :dev 다이제스트를
      # 확인해 스스로 pull하고 ai 컨테이너를 다시 만든다. 들어오는 길이 없으므로 여기서는 :dev만 옮기고 배포 명령을 보내지 않는다.
      # (예전 EC2 앱 호스트 SSM 배포 단계는 전환과 함께 뺐다.)

      # 공개 주소로 끝까지 닿는지 본다. 새 이미지 교체는 updater가 1분 안에 하므로 여기서 버전까지 맞추지는 않는다.
      - name: Smoke test (server /actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://dev-api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ dev health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::dev health 200/UP 확인 실패. 홈서버 manyak-dev 스택(docker compose ps, logs ai) 확인"; exit 1


  # main 푸시(ECR 갱신) 후 → 운영 앱 호스트에 SSM 문서로 배포 + 헬스 스모크 (KNK-2106, 예전 ECS 는 KNK-963)
  deploy-prod:
    name: Deploy to app host (prod)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 배포를 직렬화(큐잉)한다. cancel-in-progress=false — 이미 호스트로 보낸 배포 명령은 GitHub 잡을 취소해도
    # 되돌릴 수 없어서, 취소보다 큐잉이 안전하다. 세 앱 레포 사이의 직렬화는 호스트의 deploy.sh 가 flock 으로 한다
    # (예전 "Wait for service to settle" 단계가 하던 일).
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 배포 대상은 "이 실행의 커밋"이 아니라 "현재 main HEAD"다.
      # 예전처럼 "내가 HEAD 가 아니면 skip" 하면 최신 커밋이 아무 데서도 배포되지 않을 수 있다 —
      # GitHub concurrency 는 대기 슬롯이 1개라, 늦게 끝난 옛 빌드의 잡이 큐에서 기다리던 최신
      # 실행을 밀어내 취소시키고, 정작 자기는 게이트에서 skip 하기 때문이다.
      # 어느 실행이 돌든 항상 HEAD 를 배포하면 그 구멍이 사라진다(중복 배포는 같은 이미지라 무해).
      - name: Gate — 배포 대상(main HEAD) 확인
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          {
            echo "deploy_sha=$DEPLOY_SHA"
            echo "deploy_short_sha=${DEPLOY_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "배포 대상 main HEAD: $DEPLOY_SHA (이 실행의 커밋: $GITHUB_SHA)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # HEAD 의 이미지가 아직 ECR 에 없으면 = HEAD 빌드가 아직 안 끝났다는 뜻이라 여기서 멈춘다.
      # 실패가 아니다 — 그 커밋 자신의 실행이 배포한다. 매니페스트 조회는 pull 권한(ecr:BatchGetImage)으로 된다.
      - name: Check image for main HEAD
        id: image
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
          if OUT=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "배포 이미지 확인: $IMAGE"
            exit 0
          fi
          echo "$OUT"
          # 조회 실패를 뭉뚱그려 "아직 빌드 안 됨"으로 넘기지 않는다(fail-closed).
          if [ "${{ steps.gate.outputs.deploy_sha }}" = "$GITHUB_SHA" ]; then
            echo "::error::이 실행이 방금 push 한 HEAD 이미지($IMAGE)를 조회하지 못했습니다 — 빌드 또는 권한 문제"
            exit 1
          fi
          if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD(${{ steps.gate.outputs.deploy_short_sha }}) 이미지가 아직 ECR 에 없습니다(매니페스트 부재로 판별) — 그 커밋의 실행이 배포합니다"
            exit 0
          fi
          echo "::error::이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다(인증·네트워크 등) — 위 출력 확인"
          exit 1

      # 운영 앱 호스트의 deploy.sh 를 SSM 문서(manyak-prod-host-deploy-ai)로 부른다(KNK-2106). 22 번도 SSH 키도 없다.
      # deploy.sh: 새 ai 컨테이너 기동 → 헬스 통과 → 내부 프록시(ai.internal, server 가 부름) 전환 → 옛 컨테이너의 진행 중
      # 스트림 드레인(240초) → 옛 컨테이너 정지(stop 130초). 새 컨테이너가 헬스를 못 넘으면 지우고 실패로 끝나며 옛 ai 가 계속 서비스한다.
      # ai 는 공개 주소가 없어 공개 스모크를 하지 않는다(헬스·프록시 전환이 확인이다).
      # 불변 태그(:<sha7>)로 배포하고, 호스트가 현재·직전 이미지를 기록한다(/data/state, image=rollback 으로 되돌림).
      # 배포 확인: 예전의 태스크 정의·배포 id 대조 대신, deploy.sh 가 끝에 찍는 "deployed <image>" 줄이 요청한 이미지인지 본다.
      - name: Deploy to prod app host (SSM)
        id: deploy
        if: steps.image.outputs.exists == 'true'
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          CID=$(aws ssm send-command --document-name "$PROD_DEPLOY_DOCUMENT" \
            --targets "Key=tag:manyak:host,Values=$PROD_HOST_TAG" --parameters "image=$IMAGE" \
            --timeout-seconds 600 --query Command.CommandId --output text)
          echo "SSM 명령 $CID ($IMAGE)"
          # 드레인(최대 240초)과 기동(약 1분), 다른 레포 배포의 잠금 대기까지 넉넉히 기다린다(최대 30분).
          IID=""
          for i in $(seq 1 180); do
            sleep 10
            if [ -z "$IID" ] || [ "$IID" = "None" ]; then
              IID=$(aws ssm list-command-invocations --command-id "$CID" --query 'CommandInvocations[0].InstanceId' --output text)
              [ -n "$IID" ] && [ "$IID" != "None" ] || { echo "명령 전달 대기 $i"; continue; }
            fi
            STATUS=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" --query Status --output text)
            case "$STATUS" in
              Pending|InProgress|Delayed) echo "배포 $STATUS — 대기 $i/180 (10s)" ;;
              *) break ;;
            esac
          done
          OUT=$(aws ssm get-command-invocation --command-id "$CID" --instance-id "$IID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text || true)
          echo "$OUT"
          if [ "$STATUS" != "Success" ]; then
            echo "::error::운영 앱 호스트 배포가 $STATUS 로 끝났습니다. 옛 ai 가 계속 서비스합니다. 위 출력과 CloudWatch /manyak/prod/app-host 확인"
            exit 1
          fi
          if ! printf '%s\n' "$OUT" | grep -qF "ai: deployed $IMAGE as "; then
            echo "::error::배포 명령은 성공했지만 출력에서 'deployed $IMAGE' 를 찾지 못했습니다 — 호스트의 /data/state/ai.image 확인"
            exit 1
          fi
          echo "deployed=true" >> "$GITHUB_OUTPUT"
          echo "✅ 운영 앱 호스트 배포 완료: $IMAGE"

      # 배포가 끝난 뒤에만 :latest 를 main HEAD 로 옮긴다. 호스트는 불변 태그로 배포하므로 :latest 는 호스트 기록이
      # 없을 때의 기본값(새 데이터 디스크)과 옛 ECS 로 되돌릴 때 쓰인다. 실패한 배포는 :latest 를 건드리지 않으므로
      # 예전의 ":latest 복구" 단계가 필요 없다. manifest 를 복사하므로 멀티아키 인덱스가 유지된다.
      - name: Promote main HEAD to :latest
        if: steps.deploy.outputs.deployed == 'true'
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "✅ :latest -> ${{ steps.gate.outputs.deploy_short_sha }}"
