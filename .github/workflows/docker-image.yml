name: Docker Image

on:
  pull_request:
    branches:
      - dev
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write # GHCR(dev) 푸시
  id-token: write # AWS OIDC(dev·main) 인증

env:
  GHCR_IMAGE: ghcr.io/kim-n-kang/manyak-ai
  ECR_REPOSITORY: manyak-ai
  AWS_REGION: ap-northeast-2
  ECS_CLUSTER: manyak-dev
  ECS_SERVICE: manyak-dev

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      # branch coverage를 측정하고 최저선(90%) 아래면 실패시킨다(재감사 #9). 최저선은 현재
      # 커버리지(95%)보다 낮게 잡은 baseline이다 — 정상 변경을 막지 않으면서 회귀를 걸러내고,
      # 팀 합의로 점차 올린다. term-missing이 미실행 라인을 PR 로그에 남긴다.
      - name: Run tests
        env:
          DEEPSEEK_API_KEY: dummy-key-for-ci
          OPENAI_API_KEY: dummy-key-for-ci
        run: pytest --cov --cov-report=term-missing --cov-fail-under=90

  # 빌드한 이미지를 실제로 기동해 /api/v1/health 200을 PR 단계에서 확인한다(KNK-574 감사 3장).
  # CI가 이미지를 빌드만 하고 띄우지 않아, COPY prompt 누락 등 패키징 회귀가 prod 배포 게이트에서야
  # 드러나던 공백을 메운다. 프롬프트 로딩이 임포트 시점이라 컨테이너 기동만으로 회귀가 걸린다.
  smoke:
    name: Image smoke (health)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 러너 아키텍처(amd64) 단일 이미지를 로컬 데몬에 적재한다(멀티아치 build-push는 --load 불가).
      - name: Build image (load to local daemon)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          load: true
          tags: manyak-ai:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container and check health
        run: |
          docker run -d --name ai-smoke \
            -e DEEPSEEK_API_KEY=dummy-key-for-ci \
            -e OPENAI_API_KEY=dummy-key-for-ci \
            -p 8000:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health.json -w '%{http_code}' http://localhost:8000/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health.json; then
              echo "✅ /api/v1/health 200 ok"; cat /tmp/health.json
              docker rm -f ai-smoke; exit 0
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::health 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke
          docker rm -f ai-smoke; exit 1

      # Langfuse 활성 경로 스모크(KNK-652 리뷰 P2). 유닛 테스트의 활성 경로는 가짜 SDK를 쓰고
      # (전역 openai 패치 부작용 격리), 위 기본 스모크는 키 없이 no-op 경로만 지난다 — 실제 설치된
      # langfuse SDK(lock 파일 없는 4.x 범위)로 초기화가 깨지는 회귀를 여기서 잡는다. 더미 키라
      # 과금·실데이터 전송 없음(백그라운드 인증 실패만 무해하게 남음). health에 더해 "Langfuse 활성"
      # 로그까지 확인해 가드(JP·prod) 통과 + 실 SDK 초기화 성공을 함께 고정한다.
      - name: Run container with Langfuse enabled (dummy keys) and check health
        run: |
          docker run -d --name ai-smoke-lf \
            -e DEEPSEEK_API_KEY=dummy-key-for-ci \
            -e OPENAI_API_KEY=dummy-key-for-ci \
            -e LANGFUSE_PUBLIC_KEY=pk-lf-dummy-ci \
            -e LANGFUSE_SECRET_KEY=sk-lf-dummy-ci \
            -e LANGFUSE_HOST=https://jp.cloud.langfuse.com \
            -e SENTRY_ENVIRONMENT=prod \
            -p 8001:8000 manyak-ai:smoke
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/health-lf.json -w '%{http_code}' http://localhost:8001/api/v1/health || true)
            if [ "$code" = "200" ] && grep -q '"status":"ok"' /tmp/health-lf.json; then
              if docker logs ai-smoke-lf 2>&1 | grep -q "Langfuse 활성"; then
                echo "✅ health 200 ok + Langfuse 활성(실 SDK 초기화·가드 통과)"
                docker rm -f ai-smoke-lf; exit 0
              fi
              echo "::error::health는 통과했으나 'Langfuse 활성' 로그 없음 — 가드/초기화 회귀:"; docker logs ai-smoke-lf
              docker rm -f ai-smoke-lf; exit 1
            fi
            echo "health 대기 $i/30 (code=$code)"; sleep 2
          done
          echo "::error::Langfuse 활성 스모크 실패 — 컨테이너 로그:"; docker logs ai-smoke-lf
          docker rm -f ai-smoke-lf; exit 1

  docker:
    name: Docker build and publish
    runs-on: ubuntu-latest
    needs: [test, smoke]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dev 푸시 → 개발용 GHCR
      - name: Log in to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # main 푸시 → 배포용 ECR (OIDC, 장기 키 미보관)
      # main 에서의 수동 실행(workflow_dispatch)도 포함한다. 롤백 경로인 EC2 배포 잡이 그 이벤트로만
      # 도는데, 여기서 인증을 건너뛰면 태그가 ECR 이 아닌 GHCR 로 잡히고 push 도 되지 않아
      # 롤백 실행이 "ECR 에 그 SHA 가 이미 있어야만" 성립하는 반쪽 경로가 된다(KNK-963).
      - name: Configure AWS credentials
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: aws-actions/amazon-ecr-login@v2

      # 대상 레지스트리/태그 결정: main → ECR(short-sha), 그 외 → GHCR(short-sha)
      - name: Resolve image tags
        id: image-tags
        run: |
          SHORT_SHA="${GITHUB_SHA::7}"
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            # main 브랜치도 여기서 :latest 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :latest 를 옛 SHA 로 되돌릴 수 있다.
            # :latest 승격은 deploy-prod 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-963).
            REGISTRY="${{ steps.ecr-login.outputs.registry }}"
            {
              echo "tags<<EOF"
              echo "${REGISTRY}/${ECR_REPOSITORY}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            # dev 브랜치는 여기서 :dev 를 붙이지 않는다. 빌드 잡은 직렬화돼 있지 않아,
            # 두 푸시가 겹치면 이전 빌드가 나중에 끝나며 :dev 를 옛 SHA 로 되돌릴 수 있다.
            # :dev 승격은 deploy-dev 의 최신 SHA 게이트 뒤(직렬화 구간)에서 한다(KNK-829).
            {
              echo "tags<<EOF"
              echo "${GHCR_IMAGE}:${SHORT_SHA}"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/dev' || github.ref == 'refs/heads/main')) || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') }}
          tags: ${{ steps.image-tags.outputs.tags }}

  # dev 푸시(GHCR 갱신) 후 → 개발 ECS 서비스에 새 배포를 트리거 (KNK-829)
  deploy-dev:
    name: Deploy to ECS (dev)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/dev'
    # manyak-server 의 같은 잡과 그룹명을 공유한다. 두 레포가 같은 ECS 서비스를 갱신하므로
    # 레포별로 큐를 나누면 동시 배포가 겹칠 수 있다(GitHub concurrency 는 레포 스코프라
    # 완전한 상호배제는 아니지만, 같은 레포 안의 연속 푸시는 이걸로 직렬화된다).
    concurrency:
      group: manyak-dev-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # GHCR 의 dev 는 가변 태그다. 더 새 푸시가 있으면 그쪽 잡이 배포하게 두고 여기서는 건너뛴다.
      - name: Gate — 최신 dev SHA 확인(stale 배포 방지)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LATEST_SHA=$(gh api "repos/${{ github.repository }}/commits/dev" --jq '.sha')
          if [ "$LATEST_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::최신 dev($LATEST_SHA)이 더 있어 stale($GITHUB_SHA) 배포를 건너뜁니다"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # 최신 SHA 게이트를 통과한 뒤에만 :dev 를 이 커밋으로 옮긴다. 빌드 잡에서 붙이면
      # 늦게 끝난 옛 빌드가 태그를 되돌릴 수 있다(리뷰 지적). manifest 를 복사하므로
      # 멀티아키(amd64·arm64) 인덱스가 그대로 유지된다.
      - name: Promote ${{ github.sha }} to :dev
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker buildx imagetools create --tag "${GHCR_IMAGE}:dev" "${GHCR_IMAGE}:${GITHUB_SHA::7}"
          echo "✅ :dev -> ${GITHUB_SHA::7}"

      - name: Configure AWS credentials (OIDC)
        if: steps.gate.outputs.skip != 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEV_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 태스크 정의는 이미 GHCR dev 좌표를 들고 있으므로 새 리비전을 등록하지 않는다.
      # 개발은 server·ai 가 태스크 정의 하나에 함께 있어, 이 배포는 두 컨테이너를 모두
      # 현재 GHCR dev 이미지로 갱신한다(ai 만 머지해도 server 가 함께 바뀐다).
      - name: Force new ECS deployment
        if: steps.gate.outputs.skip != 'true'
        run: |
          # 이 호출이 만든 배포 id 를 잡아 둔다. services-stable 만으로는 부족하다 —
          # 서비스에 circuit breaker rollback 이 켜져 있어(compute-ecs), 새 태스크가 못 뜨면 ECS 가
          # 직전 배포로 되돌리고, 그 상태도 "안정적인 배포 1개 + desired 충족"이라 waiter 가 성공한다.
          # 그러면 이후 헬스 검사는 옛 태스크를 보게 되어 실패한 배포가 초록으로 끝난다.
          DEPLOY_ID=$(aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --no-cli-pager \
            --query "service.deployments[?status=='PRIMARY'].id | [0]" --output text)
          echo "배포 id: $DEPLOY_ID"

          # 그 배포가 COMPLETED 가 될 때까지 폴링한다. 롤백되면 rolloutState 가 FAILED 가 되거나
          # 배포 자체가 목록에서 사라지므로 둘 다 실패로 처리한다.
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?id=='$DEPLOY_ID'].rolloutState | [0]" --output text)
            case "$STATE" in
              COMPLETED) echo "✅ 배포 $DEPLOY_ID COMPLETED"; break ;;
              FAILED) echo "::error::배포 $DEPLOY_ID 가 FAILED — circuit breaker 롤백 발생. CloudWatch /ecs/manyak-dev 확인"; exit 1 ;;
              None|"") echo "::error::배포 $DEPLOY_ID 가 사라졌습니다(롤백으로 교체) — CloudWatch /ecs/manyak-dev 확인"; exit 1 ;;
              *) echo "배포 $STATE — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATE" = "COMPLETED" ]

      # 서비스가 안정화돼도 ai 는 죽어 있을 수 있다 — ai 컨테이너는 essential=false 라
      # 태스크를 죽이지 않고, ALB 헬스는 server 만 본다. AI 레포의 배포는 특히 이걸 봐야 한다.
      - name: Verify container health (ai 포함)
        if: steps.gate.outputs.skip != 'true'
        run: |
          TASK=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --service-name "$ECS_SERVICE" \
            --query 'taskArns[0]' --output text)
          aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
            --query 'tasks[0].containers[].{name:name,status:lastStatus,health:healthStatus}' --output table
          # 단발 검사는 안 된다. 배포 완료 시점에도 ai 는 아직 UNKNOWN 일 수 있다 —
          # 태스크 헬스체크에 start period 와 재시도가 있고, ai 는 essential=false 라
          # 배포 완료 판정이 ai 의 healthy 를 기다려 주지 않는다.
          # 부분일치를 쓰지 않는다 — UNHEALTHY 도 "HEALTHY" 로 끝나서 비정상을 정상으로 오판한다.
          for i in $(seq 1 20); do
            AI_HEALTH=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
              --query "tasks[0].containers[?name=='ai'].healthStatus | [0]" --output text)
            AI_STATUS=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks "$TASK" \
              --query "tasks[0].containers[?name=='ai'].lastStatus | [0]" --output text)
            echo "ai: status=$AI_STATUS health=$AI_HEALTH"
            if [ "$AI_HEALTH" = "HEALTHY" ]; then
              echo "✅ ai HEALTHY"; exit 0
            fi
            if [ "$AI_HEALTH" = "UNHEALTHY" ] || [ "$AI_STATUS" = "STOPPED" ]; then
              echo "::error::ai 컨테이너가 기동에 실패했습니다(status=$AI_STATUS health=$AI_HEALTH) — 모델 설정·공급자 키를 CloudWatch /ecs/manyak-dev 로그에서 확인"
              exit 1
            fi
            echo "ai 기동 대기 $i/20 (15s)..."; sleep 15
          done
          echo "::error::제한 시간 안에 ai 가 HEALTHY 가 되지 않았습니다 — CloudWatch /ecs/manyak-dev 로그 확인"; exit 1

      - name: Smoke test (server /actuator/health)
        if: steps.gate.outputs.skip != 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://dev-api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ dev health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::dev health 200/UP 확인 실패 — CloudWatch /ecs/manyak-dev 로그 확인"; exit 1

  # main 푸시(ECR 갱신) 후 → 운영 ECS 서비스에 새 배포를 트리거 + 헬스 검증 (KNK-963)
  deploy-prod:
    name: Deploy to ECS (prod)
    needs: docker
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # manyak-server 의 같은 잡과 그룹명을 공유한다. 두 레포가 같은 ECS 서비스를 갱신하므로
    # 레포별로 큐를 나누면 동시 배포가 겹칠 수 있다(GitHub concurrency 는 레포 스코프라
    # 완전한 상호배제는 아니지만, 같은 레포 안의 연속 푸시는 이걸로 직렬화된다).
    # cancel-in-progress=false — 이미 ECS 로 dispatch 된 배포는 잡을 취소해도 되돌릴 수 없다.
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      ECS_CLUSTER: manyak-prod
      ECS_SERVICE: manyak-prod
    steps:
      # 배포 대상은 "이 실행의 커밋"이 아니라 "현재 main HEAD"다.
      # 예전처럼 "내가 HEAD 가 아니면 skip" 하면 최신 커밋이 아무 데서도 배포되지 않을 수 있다 —
      # GitHub concurrency 는 대기 슬롯이 1개라, 늦게 끝난 옛 빌드의 잡이 큐에서 기다리던 최신
      # 실행을 밀어내 취소시키고, 정작 자기는 게이트에서 skip 하기 때문이다.
      # 어느 실행이 돌든 항상 HEAD 를 배포하면 그 구멍이 사라진다(중복 배포는 같은 이미지라 무해).
      - name: Gate — 배포 대상(main HEAD) 확인
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DEPLOY_SHA=$(gh api "repos/${{ github.repository }}/commits/main" --jq '.sha')
          {
            echo "deploy_sha=$DEPLOY_SHA"
            echo "deploy_short_sha=${DEPLOY_SHA:0:7}"
          } >> "$GITHUB_OUTPUT"
          echo "배포 대상 main HEAD: $DEPLOY_SHA (이 실행의 커밋: $GITHUB_SHA)"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # HEAD 의 이미지가 아직 ECR 에 없으면 = HEAD 빌드가 아직 안 끝났다는 뜻이라 여기서 멈춘다.
      # 실패가 아니다 — 그 커밋 자신의 실행이 배포한다.
      # ecr:DescribeImages 는 CI 역할에 없다(ecr-push 인라인 정책은 push/pull 액션만이고,
      # simulate-principal-policy 로 implicitDeny 확인). 매니페스트 조회는 pull 권한
      # (ecr:BatchGetImage = allowed)으로 되므로 ECR 로그인 뒤 imagetools inspect 로 확인한다.
      - name: Check image for main HEAD
        id: image
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${{ steps.gate.outputs.deploy_short_sha }}"
          if OUT=$(docker buildx imagetools inspect "$IMAGE" 2>&1); then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "배포 이미지 확인: $IMAGE"
            exit 0
          fi
          echo "$OUT"
          # 조회 실패를 뭉뚱그려 "아직 빌드 안 됨"으로 넘기지 않는다(fail-closed).
          # 이 실행이 HEAD 자신이면 build 잡이 방금 push 한 이미지라 없을 수가 없다 — 무조건 실패.
          if [ "${{ steps.gate.outputs.deploy_sha }}" = "$GITHUB_SHA" ]; then
            echo "::error::이 실행이 방금 push 한 HEAD 이미지($IMAGE)를 조회하지 못했습니다 — 빌드 또는 권한 문제"
            exit 1
          fi
          # HEAD 가 다른 커밋일 때만, 매니페스트 부재로 판별되는 경우에 한해 건너뛴다.
          if printf '%s' "$OUT" | grep -qiE 'not found|manifest unknown|manifest_unknown|does not exist|no such manifest'; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::main HEAD(${{ steps.gate.outputs.deploy_short_sha }}) 이미지가 아직 ECR 에 없습니다(매니페스트 부재로 판별) — 그 커밋의 실행이 배포합니다"
            exit 0
          fi
          echo "::error::이미지 조회가 매니페스트 부재가 아닌 이유로 실패했습니다(인증·네트워크 등) — 위 출력 확인"
          exit 1

      # :latest 를 main HEAD 로 옮긴다. 빌드 잡에서 붙이면 늦게 끝난 옛 빌드가 태그를 되돌릴 수
      # 있다(dev 의 :dev 와 같은 버그, KNK-829). manifest 를 복사하므로 멀티아키 인덱스가 유지된다.
      - name: Promote main HEAD to :latest
        id: promote
        if: steps.image.outputs.exists == 'true'
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}"
          # 승격 전 현재 :latest 의 digest 를 보관한다(아래 복구 스텝이 되돌릴 대상).
          # 인덱스 digest 라 되돌려도 멀티아키 인덱스가 유지된다. :latest 가 아직 없으면 빈 값.
          PREV_DIGEST=$(docker buildx imagetools inspect "${IMAGE}:latest" 2>/dev/null \
            | awk '/^Digest:/{print $2; exit}')
          echo "PREV_DIGEST=$PREV_DIGEST" >> "$GITHUB_ENV"
          echo "승격 전 :latest digest: ${PREV_DIGEST:-(없음)}"
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}:${{ steps.gate.outputs.deploy_short_sha }}"
          echo "promoted=true" >> "$GITHUB_OUTPUT"
          echo "✅ :latest -> ${{ steps.gate.outputs.deploy_short_sha }}"

      # 운영 태스크 정의는 이미 :latest 좌표를 들고 있으므로 새 리비전을 등록하지 않는다
      # (CI 역할에 RegisterTaskDefinition·iam:PassRole 권한이 없다).
      # force-new-deployment 가 같은 정의로 태스크를 다시 띄우면서 위에서 승격한 :latest 를 다시 pull 한다.
      #
      # 운영도 server·ai 가 태스크 정의 하나에 함께 있어, 이 배포는 두 컨테이너를 모두 재시작한다.
      # 둘 다 :latest 라 server 는 그 시점의 manyak-server 최신 이미지로 함께 뜬다.
      - name: Force new ECS deployment
        if: steps.image.outputs.exists == 'true'
        run: |
          # 이 호출이 만든 배포 id 를 잡아 둔다. services-stable 만으로는 부족하다 —
          # 서비스에 circuit breaker rollback 이 켜져 있어, 새 태스크가 못 뜨면 ECS 가
          # 직전 배포로 되돌리고, 그 상태도 "안정적인 배포 1개 + desired 충족"이라 waiter 가 성공한다.
          # 그러면 이후 헬스 검사는 옛 태스크를 보게 되어 실패한 배포가 초록으로 끝난다.
          DEPLOY_ID=$(aws ecs update-service \
            --cluster "$ECS_CLUSTER" --service "$ECS_SERVICE" \
            --force-new-deployment --no-cli-pager \
            --query "service.deployments[?status=='PRIMARY'].id | [0]" --output text)
          echo "배포 id: $DEPLOY_ID"
          # 헬스 검사 스텝이 "이번 배포가 띄운 태스크"만 고르는 데 쓴다.
          echo "DEPLOY_ID=$DEPLOY_ID" >> "$GITHUB_ENV"

          # 그 배포가 COMPLETED 가 될 때까지 폴링한다. 롤백되면 rolloutState 가 FAILED 가 되거나
          # 배포 자체가 목록에서 사라지므로 둘 다 실패로 처리한다.
          for i in $(seq 1 60); do
            STATE=$(aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" \
              --query "services[0].deployments[?id=='$DEPLOY_ID'].rolloutState | [0]" --output text)
            case "$STATE" in
              COMPLETED) echo "✅ 배포 $DEPLOY_ID COMPLETED"; break ;;
              FAILED) echo "::error::배포 $DEPLOY_ID 가 FAILED — circuit breaker 롤백 발생. CloudWatch /ecs/manyak-prod 확인"; exit 1 ;;
              None|"") echo "::error::배포 $DEPLOY_ID 가 사라졌습니다(롤백으로 교체) — CloudWatch /ecs/manyak-prod 확인"; exit 1 ;;
              *) echo "배포 $STATE — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATE" = "COMPLETED" ]

      # 서비스가 안정화돼도 ai 는 죽어 있을 수 있다 — ai 컨테이너는 essential=false 라
      # 태스크를 죽이지 않고, ALB 헬스는 server 만 본다. AI 레포의 배포는 특히 이걸 봐야 한다.
      - name: Verify container health (ai 포함)
        if: steps.image.outputs.exists == 'true'
        run: |
          # 단발 검사는 안 된다. 배포 완료 시점에도 ai 는 아직 UNKNOWN 일 수 있다 —
          # 태스크 헬스체크에 start period 와 재시도가 있고, ai 는 essential=false 라
          # 배포 완료 판정이 ai 의 healthy 를 기다려 주지 않는다.
          # 부분일치를 쓰지 않는다 — UNHEALTHY 도 "HEALTHY" 로 끝나서 비정상을 정상으로 오판한다.
          # 검사는 ai 컨테이너만 본다. 운영 태스크의 로그 사이드카 log_router(aws-for-fluent-bit)는
          # healthCheck 가 없어 healthStatus 가 영원히 UNKNOWN 이라, 전 컨테이너 검사는 매번 타임아웃한다.
          # 검사 대상은 이번 배포가 띄운 태스크로 한정한다. 서비스 태스크의 startedBy 는
          # update-service 가 돌려준 배포 id(ecs-svc/...)와 같은 값이다(운영·개발 서비스에서 실측 확인).
          # ListTasks 는 --started-by 를 다른 필터와 함께 쓸 수 없어(InvalidParameterException)
          # --service-name 은 넣지 않는다. 배포 id 가 유일하므로 클러스터 범위로 충분하다.
          # taskArns[0] 한 개만 보면 desiredCount 가 2 이상일 때 나머지를 놓치고,
          # 드레이닝 중인 옛 배포의 태스크를 잘못 볼 수도 있다.
          for i in $(seq 1 20); do
            TASKS=$(aws ecs list-tasks --cluster "$ECS_CLUSTER" --started-by "$DEPLOY_ID" \
              --query 'taskArns[]' --output text)
            if [ -z "$TASKS" ]; then
              echo "::error::배포 $DEPLOY_ID 로 시작된 태스크가 없습니다 — CloudWatch /ecs/manyak-prod 로그 확인"
              exit 1
            fi
            aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
              --query 'tasks[].containers[].{task:taskArn,name:name,status:lastStatus,health:healthStatus}' --output table
            # ai 컨테이너 수가 태스크 수와 정확히 일치하는지 본다. 0 인지만 보면 여러 태스크 중
            # 일부에서 ai 가 빠져도 남은 쪽 개수로 통과한다. 기대값: 태스크마다 ai 1개.
            read -r TASK_COUNT TARGETS <<< "$(aws ecs describe-tasks \
              --cluster "$ECS_CLUSTER" --tasks $TASKS \
              --query "[length(tasks), length(tasks[].containers[?name=='ai'][])]" --output text)"
            if [ "$TARGETS" != "$TASK_COUNT" ]; then
              echo "::error::태스크 $TASK_COUNT 개인데 ai=$TARGETS 입니다 — 컨테이너 누락 또는 이름 변경. 태스크 정의 확인"
              exit 1
            fi
            AI_PENDING=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
              --query "length(tasks[].containers[?name=='ai' && healthStatus!='HEALTHY'][])" --output text)
            if [ "$AI_PENDING" = "0" ]; then
              echo "✅ 전 태스크의 ai HEALTHY (대상 $TARGETS 개)"; exit 0
            fi
            AI_BAD=$(aws ecs describe-tasks --cluster "$ECS_CLUSTER" --tasks $TASKS \
              --query "length(tasks[].containers[?name=='ai' && (healthStatus=='UNHEALTHY' || lastStatus=='STOPPED')][])" --output text)
            if [ "$AI_BAD" != "0" ]; then
              echo "::error::ai 컨테이너가 기동에 실패했습니다 — 모델 설정·공급자 키를 CloudWatch /ecs/manyak-prod 로그에서 확인"
              exit 1
            fi
            echo "ai 기동 대기 $i/20 (15s)..."; sleep 15
          done
          echo "::error::제한 시간 안에 ai 가 HEALTHY 가 되지 않았습니다 — CloudWatch /ecs/manyak-prod 로그 확인"; exit 1

      - name: Smoke test (server /actuator/health)
        if: steps.image.outputs.exists == 'true'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS https://api.manyak.app/actuator/health | grep -q '"status":"UP"'; then
              echo "✅ health UP"; exit 0
            fi
            echo "health 대기 $i/12 (15s)..."; sleep 15
          done
          echo "::error::health 200/UP 확인 실패 — CloudWatch /ecs/manyak-prod 로그 확인"; exit 1

      # 배포·헬스·스모크가 실패하면 :latest 를 승격 전 이미지로 되돌린다.
      # circuit breaker 가 태스크를 롤백해도 :latest 는 실패 이미지를 가리킨 채라,
      # 다음 force-new-deployment(상대 레포 릴리스 포함)가 실패 이미지를 다시 띄운다.
      - name: Restore :latest on failure
        if: failure() && steps.promote.outputs.promoted == 'true'
        run: |
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}"
          if [ -z "$PREV_DIGEST" ]; then
            echo "::warning:::latest 가 승격 전에 없었어 되돌릴 대상이 없습니다 — :latest 는 실패한 ${{ steps.gate.outputs.deploy_short_sha }} 를 가리킵니다. 수동 조치 필요"
            exit 0
          fi
          docker buildx imagetools create --tag "${IMAGE}:latest" "${IMAGE}@${PREV_DIGEST}"
          echo "↩️ :latest 복구 -> $PREV_DIGEST"
  # [롤백 경로] 전용 SSM 문서(manyak-prod-ai-deploy)로 EC2에 AI 배포
  # (문서가 내부에서 deploy.sh + `up -d --wait ai` 로 health 게이트까지 수행)
  # 이 잡은 manyak-terraform 에서 ALB 트래픽을 EC2 로 전환(ecs_traffic_weight = 0)한 뒤 실행하는
  # 전제다. 배포 검증은 도메인 스모크가 아니라 전용 SSM 문서 안의 `docker compose up -d --wait ai`
  # 헬스 게이트가 담당하므로(이 잡에는 도메인 스모크 스텝이 없다), 트래픽 전환 전에 실행해도
  # EC2 배포 성패 자체는 판별된다. 다만 그 상태에서 api.manyak.app 은 여전히 ECS 를 가리키므로,
  # 롤백이 실제로 사용자에게 반영됐는지는 트래픽을 전환해야 확인된다.
  # 운영 트래픽은 ECS 로 넘어갔고(KNK-856) 배포도 위 deploy-prod 가 담당한다. 이 잡은 ECS 배포가
  # 문제일 때 EC2 로 되돌리기 위한 수동 수단으로만 남긴다 — main 푸시가 아니라 workflow_dispatch 로만 돈다
  # (이미 ECR 에 있는 :short-sha 를 배포하므로 이 실행에서 이미지를 새로 빌드하지 않아도 된다).
  # EC2 를 회수하면 이 잡을 통째로 제거한다(KNK-963).
  deploy:
    name: Deploy AI to EC2 (prod, 롤백 경로 · 수동 실행)
    needs: docker
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    # 배포를 직렬화(큐잉)한다. cancel-in-progress=false: 진행 중 배포를 취소하지 않는다.
    # (true 면 SSM send-command 로 EC2에 이미 dispatch된 원격 배포는 못 막고 GitHub 잡만 취소돼 레이스가 남음)
    # 그룹명은 ECS 배포 잡·manyak-server 와 통일한다. 롤백(EC2)과 정상 배포(ECS)가 같은 운영 자원을
    # 건드리므로, 레포 안에서만이라도 두 경로가 겹치지 않게 한 큐에 세운다(KNK-963).
    concurrency:
      group: manyak-prod-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      # 최신 main SHA 게이트를 두지 않는다. 이 잡은 사람이 의도해서 돌리는 유일한 롤백 실행이라,
      # 롤백 도중 main 이 전진했다는 이유로 skip 하면 롤백 자체가 사라진다.
      # 배포 대상은 이 실행이 체크아웃한 커밋의 이미지다.
      - name: 배포 대상 알림
        run: |
          echo "::notice::수동 롤백 실행 — 이 실행의 커밋 ${GITHUB_SHA::7} 이미지를 EC2 에 배포합니다"

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Resolve target EC2 instance
        id: ec2
        run: |
          INSTANCE_ID=$(aws ec2 describe-instances \
            --filters "Name=tag:Project,Values=manyak" "Name=tag:Name,Values=manyak-prod-app" "Name=instance-state-name,Values=running" \
            --query "Reservations[].Instances[].InstanceId | [0]" --output text)
          if [ -z "$INSTANCE_ID" ] || [ "$INSTANCE_ID" = "None" ]; then
            echo "::error::running 상태의 manyak-prod-app EC2를 찾지 못했습니다 (terraform apply 선행 필요)"; exit 1
          fi
          echo "instance_id=$INSTANCE_ID" >> "$GITHUB_OUTPUT"
          echo "대상 인스턴스: $INSTANCE_ID"

      - name: Deploy via SSM (전용 문서 manyak-prod-ai-deploy)
        run: |
          # 이 워크플로가 빌드·푸시한 정확한 이미지(short-sha)를 배포 — :latest 의 동시 push 모호성·추적성 문제 회피
          IMAGE="${{ steps.ecr-login.outputs.registry }}/${ECR_REPOSITORY}:${GITHUB_SHA::7}"
          echo "배포 이미지: $IMAGE"
          # 전용 SSM 문서(manyak-prod-ai-deploy)가 내부에서 AI_IMAGE_OVERRIDE 로 deploy.sh 를 실행하고
          # `docker compose up -d --wait ai` 로 ai healthcheck(/api/v1/health status==ok) 통과까지 대기한다.
          # 따라서 send-command 성공 = 배포 + ai healthy. (전용 역할이라 임의 셸 불가 → 별도 헬스 스모크 스텝 없음)
          CMD_ID=$(aws ssm send-command \
            --instance-ids "${{ steps.ec2.outputs.instance_id }}" \
            --document-name "manyak-prod-ai-deploy" \
            --comment "manyak-ai deploy ${GITHUB_SHA::7}" \
            --parameters ImageUri="$IMAGE" \
            --query "Command.CommandId" --output text)
          echo "SSM CommandId: $CMD_ID"
          # terminal 상태까지 폴링 (기본 `wait command-executed` 의 100s 한계로 InProgress 를 실패로 오판하지 않도록)
          STATUS="Pending"
          for i in $(seq 1 60); do
            STATUS=$(aws ssm get-command-invocation \
              --command-id "$CMD_ID" --instance-id "${{ steps.ec2.outputs.instance_id }}" \
              --query "Status" --output text 2>/dev/null || echo "Pending")
            case "$STATUS" in
              Success) echo "✅ SSM Success (배포 + ai healthcheck 통과)"; break ;;
              Failed|Cancelled|TimedOut|Undeliverable|Terminated)
                echo "::error::SSM $STATUS — 배포 또는 ai health 실패"
                aws ssm get-command-invocation --command-id "$CMD_ID" \
                  --instance-id "${{ steps.ec2.outputs.instance_id }}" \
                  --query "StandardErrorContent" --output text || true
                exit 1 ;;
              *) echo "SSM $STATUS — 대기 $i/60 (10s)"; sleep 10 ;;
            esac
          done
          [ "$STATUS" = "Success" ]
