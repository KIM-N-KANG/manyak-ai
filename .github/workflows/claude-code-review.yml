name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  claude-review:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            이 Pull Request를 한국어로, 적대적(adversarial)으로 코드 리뷰해줘.
            "통과시키지 않겠다"는 자세로 결함을 적극적으로 찾아내. 좋은 점 칭찬은 생략하고
            문제 지적에만 집중해. 의심스러우면 안전하다고 가정하지 말고 파고들어.

            특히 다음을 공격적으로 검증해:
            - 버그·로직 오류·처리되지 않은 엣지 케이스(null/빈값/경계/동시성)
            - 보안 취약점(입력 검증 누락, 시크릿 노출, injection, 권한)
            - 실패 경로·예외 처리·타임아웃·재시도 누락
            - 성능 문제와 불필요한 비용(중복 호출, N+1, 토큰 낭비)
            - 테스트 부재·약한 단언·커버되지 않은 분기
            - 팀 컨벤션 위반 (CLAUDE.md / 하네스 docs 기준)
            - 가정이 명시되지 않은 부분, 깨지기 쉬운 코드

            각 지적은 해당 라인에 인라인 코멘트로 남기고, 심각도를 [Critical]/[Major]/[Minor]로
            표시해. 근거 없이 넘어가지 말고, 왜 문제인지와 구체적 수정 방향을 함께 적어줘.
            실제 결함이 없으면 억지 지적은 하지 말고 그 사실을 명확히 밝혀줘.

            리뷰 원칙:
            - 추측으로 문제를 지적하지 말고 코드상의 근거를 제시하라.
            - 스타일보다 실제 장애 가능성이 있는 문제를 우선 리뷰하라.
            - 변경된 코드가 기존 코드에 미치는 영향도 함께 검토하라.
            - 마지막에 Merge 판단(BLOCK / REQUEST_CHANGES / APPROVE)을 제시하라.
          claude_args: |
            --allowed-tools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*)"
